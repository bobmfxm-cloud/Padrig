<script>
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const ERR=document.getElementById('error');
const GW=390, GH=760, PLAY_H=650, UI_H=110;
let scale=1, offX=0, offY=0, last=0;
function fit(){const s=Math.min(innerWidth/GW,innerHeight/GH);scale=s;canvas.width=Math.floor(GW*s);canvas.height=Math.floor(GH*s);canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';ctx.setTransform(s,0,0,s,0,0);}
addEventListener('resize',fit);fit();
if(!ctx.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);return this;};}
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
let mode='title', score=0, district=0, gameWon=false, frame=0;
let keys={}, pressed={};
let player={x:195,y:625,spd:3.1};
let pintmobile={x:195,y:604,a:-Math.PI/2,s:0,driving:false,unlocked:false,wanted:0};
let pubs=[], pints=[], townNPC=[], traffic=[];
let currentPub=null, currentNPC=null, message='', msgT=0, stableMsg='';
let mini={}, result={}, boss={}, race={}, carbon={}, titlePulse=0;
let kevinDown=false;
let soundOK=false, audioCtx=null;
const NPCS=['Timo','Mark','Gavin','Kevin','Aaron','Lynagh','Timo Jnr','Oisin','Seamus','David'];
const lines={
 Timo:'Darts, Padrig. Try not to throw like a wet crisp.', Mark:'Quiz time. Try not to embarrass Galway.', Gavin:'Keep the pint steady and the car steadier.', Kevin:'Arm wrestle me, pint-goblin.', Aaron:'Catch the pints before they hit the floor.', Lynagh:'Balance that tray. I am watching every wobble.', 'Timo Jnr':'Keep rhythm or leave the session.', Oisin:'Remember the round. Oisin forgets nothing.', Seamus:'500 pints, then I will fight you.', David:'Pfffffft. Survive the gas if you think you are hard enough.', 'Trout of Knowledge':'The waves know truth. Press E to surf.', 'Freaky Kevin':'Wicklow. Wicklow. Wicklow.'
};
const ctrl={dx:0,dy:0,joy:false,jx:70,jy:705,buttons:{E:false,SP:false,OK:false,ESC:false,N1:false,N2:false,N3:false,N4:false}};
function keyName(e){let k=e.key.toLowerCase(); if(k===' ')k='space'; if(k==='escape')k='esc'; if(k==='enter')k='ok'; return k;}
addEventListener('keydown',e=>{let k=keyName(e); if(!keys[k])pressed[k]=true; keys[k]=true; if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault(); if(k==='1'||k==='2'||k==='3'||k==='4')pressed[k]=true;});
addEventListener('keyup',e=>{keys[keyName(e)]=false;});
function once(k){let p=pressed[k]||false; pressed[k]=false; return p;}
function held(dir){if(dir==='left')return keys.a||keys.arrowleft||ctrl.dx<-0.25; if(dir==='right')return keys.d||keys.arrowright||ctrl.dx>0.25; if(dir==='up')return keys.w||keys.arrowup||ctrl.dy<-0.25; if(dir==='down')return keys.s||keys.arrowdown||ctrl.dy>0.25; if(dir==='space')return keys.space||ctrl.buttons.SP; return false;}
function consumeButton(name){
 const map={E:'e',SP:'space',OK:'ok',ESC:'esc',N1:'1',N2:'2',N3:'3',N4:'4'};
 let p=ctrl.buttons[name]||once(map[name]);

}
function ptrPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
function pointerDown(e){if(!soundOK){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();soundOK=true;}catch(err){}} const p=ptrPos(e); handlePointer(p.x,p.y,true); e.preventDefault();}
function pointerMove(e){const p=ptrPos(e); if(ctrl.joy){let dx=p.x-ctrl.jx,dy=p.y-ctrl.jy,l=Math.hypot(dx,dy)||1,m=42;if(l>m){dx=dx/l*m;dy=dy/l*m;}ctrl.dx=dx/m;ctrl.dy=dy/m;} e.preventDefault();}
function pointerUp(e){ctrl.joy=false;ctrl.dx=0;ctrl.dy=0;for(const k in ctrl.buttons)ctrl.buttons[k]=false; e.preventDefault();}
canvas.addEventListener('pointerdown',pointerDown,{passive:false});canvas.addEventListener('pointermove',pointerMove,{passive:false});canvas.addEventListener('pointerup',pointerUp,{passive:false});canvas.addEventListener('pointercancel',pointerUp,{passive:false});
function handlePointer(x,y,down){
 if(mode==='title'){if(y>420&&y<470){newGame();}else if(y>485&&y<535){mode='select';} return;}
 if(mode==='select'){const list=['world','darts','quiz','pour','arm','catch','tray','rhythm','memory','fart','surf','kevinfight','race','carbon','boss']; for(let i=0;i<list.length;i++){let bx=73+(i%3)*122,by=104+Math.floor(i/3)*64;if(Math.abs(x-bx)<52&&Math.abs(y-by)<24){if(list[i]==='world')mode='world';else if(list[i]==='boss')startBoss();else startMini(list[i],npcFor(list[i]));return;}}}
 if(y>=PLAY_H){
  if(x<125){ctrl.joy=true;ctrl.jx=x;ctrl.jy=y;ctrl.dx=0;ctrl.dy=0;return;}
  const hit=(cx,cy,w,h)=>Math.abs(x-cx)<=w/2&&Math.abs(y-cy)<=h/2;
  if(hit(338,708,56,42)){ctrl.buttons.E=true;pressed.e=true;return;}
  if(hit(338,652,62,46)){ctrl.buttons.SP=true;pressed.space=true;return;}
  if(hit(280,652,54,46)){ctrl.buttons.OK=true;pressed.ok=true;return;}
  if(hit(280,708,52,40)){ctrl.buttons.ESC=true;pressed.esc=true;return;}
  if(mode==='quiz'||mode==='memory'||mode==='carbon'){
    if(hit(148,706,38,30)){ctrl.buttons.N1=true;pressed['1']=true;return;}
    if(hit(188,706,38,30)){ctrl.buttons.N2=true;pressed['2']=true;return;}
    if(hit(228,706,38,30)){ctrl.buttons.N3=true;pressed['3']=true;return;}
    if(mode==='memory'&&hit(268,706,38,30)){ctrl.buttons.N4=true;pressed['4']=true;return;}
  }
  return;
 }
 if(mode==='darts'){mini.aimX=x;mini.aimY=y;if(down){throwDart();}}
 if(mode==='quiz'){for(let i=0;i<3;i++)if(y>188+i*68&&y<238+i*68){answerQuiz(i);}}
 if(mode==='memory'&&mini.show<=0){for(let i=0;i<4;i++)if(Math.abs(x-(72+i*82))<35&&y>275&&y<335){memoryPick(i+1);}}
 if(mode==='carbon'){if(y>548&&y<592)buyCarbon(1); if(y>596&&y<640)buyCarbon(2); if(y>500&&y<542)buyCarbon(3);}
}
function sfx(type){if(!soundOK||!audioCtx)return;try{let f={pint:740,hit:170,win:900,lose:95,click:430,car:120}[type]||380;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='lose'?'sawtooth':'square';o.frequency.value=f;g.gain.value=0.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.09);o.stop(audioCtx.currentTime+0.1);}catch(e){}}
function say(t,d=50){if(stableMsg!==t||msgT<8){message=t;stableMsg=t;msgT=d;}}
function text(t,x,y,sz=14,col='#fff',align='center',bold=false){ctx.fillStyle=col;ctx.font=(bold?'700 ':'')+sz+'px system-ui,Arial';ctx.textAlign=align;ctx.fillText(t,x,y);}
function panel(x,y,w,h,a=.7){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.stroke();}
function tint(c,amt){let r=(c>>16)&255,g=(c>>8)&255,b=c&255;r=clamp(r+amt,0,255);g=clamp(g+amt,0,255);b=clamp(b+amt,0,255);return (r<<16)|(g<<8)|b;}
function colorHex(n){return '#'+n.toString(16).padStart(6,'0');}
function drawPint(x,y,s=0.36,rot=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
 let glass=ctx.createLinearGradient(-18,0,18,0);
 glass.addColorStop(0,'rgba(214,238,255,.7)');glass.addColorStop(.5,'rgba(255,255,255,.18)');glass.addColorStop(1,'rgba(190,225,245,.7)');
 ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(2,30,18,4,0,0,7);ctx.fill();
 ctx.fillStyle=glass;ctx.beginPath();ctx.roundRect(-18,-26,34,54,6);ctx.fill();
 let beer=ctx.createLinearGradient(0,-22,0,26);beer.addColorStop(0,'#f5d46a');beer.addColorStop(.6,'#d9a82b');beer.addColorStop(1,'#a66a12');
 ctx.fillStyle=beer;ctx.beginPath();ctx.roundRect(-13,-16,23,39,4);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(-10,-12,5,28);
 ctx.fillStyle='#fffdf4';ctx.beginPath();ctx.arc(-10,-28,8,0,7);ctx.arc(0,-32,10,0,7);ctx.arc(10,-28,8,0,7);ctx.fill();
 ctx.strokeStyle='#dff4ff';ctx.lineWidth=2.5;ctx.strokeRect(-18,-26,34,54);
 ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(18,-4,11,-1.2,1.15);ctx.stroke();

function label(name,x,y,w=86){ctx.fillStyle='rgba(0,0,0,.62)';ctx.beginPath();ctx.roundRect(x-w/2,y-14,w,22,7);ctx.fill();text(name,x,y+2,10,'#fff','center',true);}
function drawPerson(x,y,name='Padrig',s=1,pose='idle'){
 if(name==='David')return drawDavid(x,y,s);
 const colors={Padrig:0x4a6b87,Timo:0x7b5233,Mark:0x49628c,Gavin:0x3366b4,Kevin:0x2b8b63,Aaron:0x8d6238,Lynagh:0x6b3f88,'Timo Jnr':0xa57d46,Oisin:0x49505a,Seamus:0x7c2d28,'Freaky Kevin':0xd93da8};
 const hairMap={Padrig:'#14100c',Timo:'#332113',Mark:'#343434',Gavin:'#5a2f19',Kevin:'#22170e',Aaron:'#6b3a1b',Lynagh:'#2c1535','Timo Jnr':'#6b3a1b',Oisin:'#3b3b3b',Seamus:'#8f6f47','Freaky Kevin':'#111'};
 let shirt=colors[name]||0x777777, skin=name==='Seamus'?'#c99a72':'#d7ad86', t=frame/8, bob=Math.sin(t)*1.05, walk=Math.sin(t*1.35), punch=pose==='punch'||pose==='throw';
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='rgba(0,0,0,.30)';ctx.beginPath();ctx.ellipse(0,41,20,6,0,0,7);ctx.fill();
 // legs and shoes
 ctx.fillStyle='#1d2738';ctx.fillRect(-9,27+bob+Math.max(0,walk)*2,7,24);ctx.fillRect(2,27+bob+Math.max(0,-walk)*2,7,24);
 ctx.fillStyle='#111';ctx.fillRect(-11,49+bob+Math.max(0,walk)*2,10,4);ctx.fillRect(1,49+bob+Math.max(0,-walk)*2,10,4);
 // torso with shaded curve so sprites feel less blocky
 let g=ctx.createLinearGradient(-14,0,14,34);g.addColorStop(0,colorHex(tint(shirt,18)));g.addColorStop(.55,colorHex(shirt));g.addColorStop(1,colorHex(tint(shirt,-32)));
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-13,-2+bob,26,35,8);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-8,4+bob,5,20);
 if(name==='Padrig'){ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.ellipse(0,16+bob,12,15,0,0,7);ctx.fill();}
 // neck/head
 ctx.fillStyle=skin;ctx.fillRect(-4,-10+bob,8,8);ctx.beginPath();ctx.roundRect(-12,-35+bob,24,25,8);ctx.fill();
 // hair, bald Seamus gets scalp shine
 if(name==='Seamus'){
   ctx.fillStyle='rgba(255,255,255,.17)';ctx.beginPath();ctx.ellipse(-4,-31+bob,5,3,-.5,0,7);ctx.fill();
 }else{
   ctx.fillStyle=hairMap[name]||'#2a1a11';ctx.beginPath();ctx.ellipse(0,-35+bob,13,8,0,Math.PI,0);ctx.fill();ctx.fillRect(-12,-38+bob,24,6);
 }
 // Padrig beard: wraps jaw/chin and leaves a natural mouth opening
 if(name==='Padrig'){
  ctx.fillStyle='#101010';
  ctx.beginPath();
  ctx.moveTo(-11,-26+bob);
  ctx.bezierCurveTo(-15,-17+bob,-11,-8+bob,-2,-6+bob);
  ctx.bezierCurveTo(0,-5+bob,2,-5+bob,4,-6+bob);
  ctx.bezierCurveTo(12,-9+bob,15,-18+bob,11,-26+bob);
  ctx.bezierCurveTo(8,-20+bob,3,-18+bob,0,-18+bob);
  ctx.bezierCurveTo(-4,-18+bob,-8,-20+bob,-11,-26+bob);
  ctx.fill();
  ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-22+bob,6.6,4.1,0,0,7);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1.25;ctx.beginPath();ctx.moveTo(-4,-16+bob);ctx.quadraticCurveTo(0,-14+bob,4,-16+bob);ctx.stroke();

  ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,-14+bob,3,0.05*Math.PI,0.95*Math.PI);ctx.stroke();
 }
 // eyes and brows
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4.5,-26+bob,2.35,0,7);ctx.arc(4.5,-26+bob,2.35,0,7);ctx.fill();
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-4.5,-26+bob,1.05,0,7);ctx.arc(4.5,-26+bob,1.05,0,7);ctx.fill();
 ctx.strokeStyle='#111';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(-8,-30+bob);ctx.lineTo(-2,-29+bob);ctx.moveTo(2,-29+bob);ctx.lineTo(8,-30+bob);ctx.stroke();
 // arms with animation arcs
 ctx.strokeStyle=skin;ctx.lineWidth=4.4;ctx.lineCap='round';ctx.beginPath();
 if(punch){ctx.moveTo(11,7+bob);ctx.lineTo(31,-7+bob+Math.sin(frame/3)*2);ctx.moveTo(-11,7+bob);ctx.lineTo(-22,18+bob);}else{ctx.moveTo(11,7+bob);ctx.lineTo(22,18+bob+walk*2.5);ctx.moveTo(-11,7+bob);ctx.lineTo(-22,18+bob-walk*2.5);}ctx.stroke();

function drawDavid(x,y,s=1){let b=Math.sin(frame/8)*1.5;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.33)';ctx.beginPath();ctx.ellipse(0,57,51,12,0,0,7);ctx.fill();ctx.fillStyle='#3d613e';ctx.beginPath();ctx.ellipse(0,25+b,42,60,0,0,7);ctx.fill();ctx.fillStyle='#5e805a';ctx.beginPath();ctx.ellipse(4,34+b,30,39,0,0,7);ctx.fill();ctx.fillStyle='#d7ad86';ctx.beginPath();ctx.arc(0,-32+b,18,0,7);ctx.fill();ctx.fillStyle='#5b2b16';ctx.fillRect(-18,-48+b,36,9);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-35+b,4,0,7);ctx.arc(7,-35+b,4,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-7,-35+b,1.5,0,7);ctx.arc(7,-35+b,1.5,0,7);ctx.fill();for(let i=0;i<4;i++){ctx.fillStyle='rgba(185,255,102,.22)';ctx.beginPath();ctx.arc(40+i*13,12+Math.sin(frame/10+i)*8,17,0,7);ctx.fill();}ctx.restore();label('David',x,y-66*s);}

 ctx.fillStyle='rgba(0,0,0,.30)';ctx.beginPath();ctx.ellipse(0,18,34,7,0,0,7);ctx.fill();

function buildWorld(){

 [P("OConnell's",95,155,'Kevin','arm'),P('The Crane',295,155,'Aaron','catch'),P('Salt House',95,535,'Lynagh','tray'),P('Spanish Arch',295,535,'Timo Jnr','rhythm')],
 [P('Eyre Square',195,155,'Oisin','memory'),P('The Lantern',95,535,'David','fart'),P('Carbon',295,345,'Kevin','carbon')]
 ]; pubs=maps[district]; pints=pubs.map(p=>({x:p.x+rnd(-22,22),y:p.y+54+rnd(-8,14),got:false})); townNPC=[];

function newGame(){score=0;district=0;gameWon=false;kevinDown=false;pintmobile={x:195,y:604,a:-Math.PI/2,s:0,driving:false,unlocked:false,wanted:0};player={x:195,y:625,spd:3.1};buildWorld();mode='world';}
function pubExterior(p){
 let isCarbon=p.name==='Carbon', locked=p.name==="Murphy's"&&score<500;
 // grounded stone apron and little front path
 ctx.fillStyle='rgba(0,0,0,.20)';ctx.beginPath();ctx.ellipse(p.x,p.y+50,62,10,0,0,7);ctx.fill();
 ctx.fillStyle='#b7aa8a';ctx.beginPath();ctx.roundRect(p.x-42,p.y+43,84,10,3);ctx.fill();
 ctx.strokeStyle='#d8c7a0';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(p.x,p.y+51);ctx.lineTo(p.x,Math.min(PLAY_H-18,p.y+94));ctx.stroke();
 const base=isCarbon?'#372660':p.name==="Murphy's"?'#6e4038':'#9a693c', trim=isCarbon?'#ff42c7':'#c89b3c';
 let wall=ctx.createLinearGradient(p.x-48,p.y-35,p.x+48,p.y+48);wall.addColorStop(0,colorHex(tint(parseInt(base.slice(1),16),26)));wall.addColorStop(1,base);
 ctx.fillStyle=wall;ctx.beginPath();ctx.roundRect(p.x-48,p.y-32,96,76,8);ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.stroke();
 // roof and chimney
 ctx.fillStyle=isCarbon?'#21123f':'#5b351e';ctx.beginPath();ctx.moveTo(p.x-56,p.y-30);ctx.lineTo(p.x,p.y-58);ctx.lineTo(p.x+56,p.y-30);ctx.closePath();ctx.fill();
 ctx.fillStyle='#3d2214';ctx.fillRect(p.x+28,p.y-54,10,18);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(p.x+31,p.y-55,4,7);
 // signboard
 ctx.fillStyle='rgba(0,0,0,.80)';ctx.beginPath();ctx.roundRect(p.x-54,p.y-49,108,19,4);ctx.fill();ctx.strokeStyle=trim;ctx.lineWidth=1.5;ctx.stroke();
 text(p.name,p.x,p.y-36,11,'#fff','center',true);

 let b=boss;if(consumeButton('ESC')){mode=currentPub?'pub':'world';return;}
 if(held('left'))player.x-=5;if(held('right'))player.x+=5;player.x=clamp(player.x,35,355);
 b.stage = b.shp>24?1:b.shp>12?2:3;
 b.cool--; if(b.tauntT>0)b.tauntT--;
 if(consumeButton('SP')&&b.cool<=0){b.pints.push({x:player.x,y:player.y-34,vy:-8,r:0});b.cool=12;sfx('pint');}
 b.sx+=b.dir*(1.8+b.stage*.5);if(b.sx<55||b.sx>335)b.dir*=-1;
 if(Math.random()<(b.stage===1?.022:b.stage===2?.033:.045))b.stools.push({x:b.sx,y:b.sy+25,vx:rnd(-2.2,2.2),vy:rnd(2.8,4.6),r:0});
 if(Math.random()<(b.stage===1?.013:b.stage===2?.02:.03))b.cigs.push({x:b.sx,y:b.sy+15,vx:rnd(-2.6,2.6),vy:rnd(3,5.2),r:0});
 if(Math.random()<(b.stage===3?.028:.012))b.babies.push({x:b.sx,y:b.sy+20,vx:rnd(-2.2,2.2),vy:rnd(2.6,4.6),r:0});
 if(b.tauntT===0){
  const taunts=b.stage===1?
   ['Seamus: You soft eejit!','Seamus: Come on then, Padrig!','Seamus: I run this pub!']:
   b.stage===2?
   ['Seamus: I will batter you, Padrig!','Seamus: Stop hiding behind those pints!','Seamus: You are getting lucky!']:
   ['Seamus: I am not done yet!','Seamus: Last orders for you, gobshite!','Seamus: I am taking the roof down with me!'];
  b.msg=taunts[Math.floor(Math.random()*taunts.length)]; b.tauntT=85;
 }
 if(!b.lynDead){b.lynX+=Math.sin(frame/28)*1.8;if(Math.random()<.018+b.stage*.004){let dx=player.x-b.lynX,dy=player.y-b.lynY,d=Math.hypot(dx,dy)||1;b.ls.push({x:b.lynX,y:b.lynY,vx:dx/d*(3.2+b.stage*.4),vy:dy/d*(3.2+b.stage*.4),r:0});}}
 for(let i=b.pints.length-1;i>=0;i--){let p=b.pints[i];p.y+=p.vy;p.r+=.15;if(dist(p.x,p.y,b.sx,b.sy)<58){b.shp--;b.pints.splice(i,1);sfx('hit');}
  else if(!b.lynDead&&dist(p.x,p.y,b.lynX,b.lynY)<36){b.lynHP--;b.pints.splice(i,1);b.msg='Hit Lynagh! HP '+b.lynHP;if(b.lynHP<=0){b.lynDead=true;b.ls=[];b.msg='Lynagh is down. Push his body into Seamus for double hits!';}}
  else if(b.lynDead&&dist(p.x,p.y,b.lynX,b.lynY)<45){b.lvx+=(b.sx-b.lynX)*.012;b.lvy+=(b.sy-b.lynY)*.012-1;b.pints.splice(i,1);} else if(p.y<-60)b.pints.splice(i,1);
 }
 for(const arr of [b.stools,b.cigs,b.babies])for(let i=arr.length-1;i>=0;i--){let o=arr[i];o.x+=o.vx;o.y+=o.vy;o.r+=.16;let rad=arr===b.babies?34:arr===b.cigs?25:32,dam=arr===b.babies?2:arr===b.cigs?.5:1;if(dist(o.x,o.y,player.x,player.y)<rad){b.php-=dam;arr.splice(i,1);sfx('hit');}else if(o.y>700)arr.splice(i,1);}
 for(let i=b.ls.length-1;i>=0;i--){let l=b.ls[i];l.x+=l.vx;l.y+=l.vy;l.r+=.2;if(dist(l.x,l.y,player.x,player.y)<28){b.php--;b.ls.splice(i,1);sfx('hit');}else if(l.y>700||l.x<-80||l.x>470)b.ls.splice(i,1);}
 if(b.lynDead){b.lynX+=b.lvx;b.lynY+=b.lvy;b.lvx*=.96;b.lvy*=.96;b.lynY=clamp(b.lynY,130,600);if(dist(b.lynX,b.lynY,b.sx,b.sy)<64){b.shp-=2;b.lvx=(b.lynX-b.sx)*.16;b.lvy=3;b.msg='DOUBLE HIT! Lynagh body smashed Seamus!';sfx('win');}}
 if(b.shp<=0){gameWon=true;score+=100;showResult('SEAMUS HAS FALLEN!','Padrig becomes King of Galway. +100 pints','world',true);return;}
 if(b.php<=0){showResult('Seamus wins!','Train in the pubs and try again.','pub',false);return;}
 drawBoss();
}
function drawBoss(){
 let b=boss;ctx.fillStyle='#2b120c';ctx.fillRect(0,0,GW,PLAY_H);ctx.fillStyle='#4d2b17';ctx.fillRect(20,84,350,104);ctx.fillStyle='#c89b3c';ctx.fillRect(18,78,354,8);ctx.fillRect(18,186,354,8);
 for(let i=0;i<8;i++){ctx.fillStyle=['#2f8f55','#8f2f2f','#d2a23a','#315c9c'][i%4];ctx.fillRect(45+i*38,108+(i%2)*18,15,38);}text('FINAL BOSS: SEAMUS',195,36,23,'#ffe38a','center',true);
 text('Stage '+b.stage+' • '+b.msg,195,213,12,'#fff');
 drawPerson(b.sx,b.sy,'Seamus',1.18,'throw');
 if(!b.lynDead){drawPerson(b.lynX,b.lynY,'Lynagh',.45);text('Lynagh HP '+b.lynHP,b.lynX,b.lynY-45,10,'#ffe38a');}
 else{ctx.save();ctx.translate(b.lynX,b.lynY);ctx.rotate(Math.sin(frame/10)*.2);drawPerson(0,0,'Lynagh',.45);ctx.restore();text('Push Lynagh into Seamus',198,490,12,'#ffe38a');}
 drawPerson(player.x,player.y,'Padrig',.78,'throw');
 for(const p of b.pints)drawPint(p.x,p.y,.39,p.r);
 for(const s of b.stools){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.fillStyle='#8b5a2b';ctx.fillRect(-17,-5,34,10);ctx.fillRect(-13,5,5,22);ctx.fillRect(8,5,5,22);ctx.restore();}
 for(const c of b.cigs){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle='#fff';ctx.fillRect(-9,-2,18,4);ctx.fillStyle='#d97706';ctx.fillRect(5,-2,4,4);ctx.restore();}
 for(const baby of b.babies){ctx.save();ctx.translate(baby.x,baby.y);ctx.rotate(Math.sin(baby.r)*.4);text('Baby Gavin',0,-24,9,'#fff');ctx.fillStyle='#f2c49b';ctx.beginPath();ctx.arc(0,-10,12,0,7);ctx.fill();ctx.fillStyle='#9bd0ff';ctx.fillRect(-10,2,20,20);ctx.restore();}
 for(const l of b.ls){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r);text('L²',0,8,28,'#bb55ff','center',true);ctx.restore();}
 function fancyBar(x,y,w,h,val,max,col,label,align='left'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();let g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,col);g.addColorStop(1,'#fff');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x+2,y+2,(w-4)*Math.max(0,val)/max,h-4,6);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();text(label,x+(align==='left'?4:w-4),y-4,10,'#fff',align,true);}
 fancyBar(18,56,150,18,b.php,12,'#33cc66','Padrig HP','left');fancyBar(222,56,150,18,b.shp,36,'#cc3333','Seamus HP','right');
}
function drawControls(){
 ctx.fillStyle='rgba(6,17,28,.86)';ctx.beginPath();ctx.roundRect(0,PLAY_H,GW,UI_H,16);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.stroke();
 ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.arc(62,706,42,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(62,706,42,0,7);ctx.stroke();
 ctx.fillStyle='rgba(247,236,210,.82)';ctx.beginPath();ctx.arc(62+ctrl.dx*28,706+ctrl.dy*28,17,0,7);ctx.fill();
 // separated buttons, kept below playfield so they do not cover the game
 button(342,706,62,46,'#7a1919','E');button(341,651,70,48,'#174f7a','SP');button(275,651,58,46,'#276b32','OK');button(275,706,56,42,'#333','ESC');
 if(mode==='quiz'||mode==='memory'||mode==='carbon'){
  button(140,706,34,30,'#444','1');button(178,706,34,30,'#444','2');button(216,706,34,30,'#444','3');
  if(mode==='memory')button(254,706,34,30,'#444','4');
 }
}
function button(x,y,w,h,c,t){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=2;ctx.stroke();text(t,x,y+5,15,'#fff','center',true);}
function drawMessage(){if(msgT>0){msgT--;ctx.fillStyle='rgba(0,0,0,.76)';ctx.beginPath();ctx.roundRect(15,PLAY_H-66,GW-30,48,12);ctx.fill();wrapText(message,195,PLAY_H-48,GW-55,14,'#fff');}}
function wrapText(str,x,y,maxWidth,lineH,col){ctx.fillStyle=col;ctx.font='12px system-ui,Arial';ctx.textAlign='center';const words=str.split(' ');let line='',lines=[];for(const w of words){let test=line+w+' ';if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w+' ';}else line=test;}lines.push(line);let start=y-(lines.length-1)*lineH/2;for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],x,start+i*lineH);}
function drawTitle(){ctx.fillStyle='#071018';ctx.fillRect(0,0,GW,GH);ctx.fillStyle='#18314a';ctx.fillRect(0,382,GW,268);ctx.strokeStyle='rgba(230,210,160,.35)';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(0,610);ctx.lineTo(GW,610);ctx.stroke();titlePulse+=.03;text('Pints of Galway',195,105,34,'#e8c36d','center',true);text('Polished v3 standalone Netlify build',195,140,14,'#e9eef6');drawPint(195,230,1.08,Math.sin(titlePulse)*.08);panel(85,420,220,50,.65);text('START GAME',195,452,18,'#fff','center',true);panel(85,485,220,50,.65);text('GAME SELECT / TEST',195,517,17,'#fff','center',true);text('No external files. Correct-scale sprites, roads, pubs and minigames.',195,590,12,'#b6c7d8');}
function drawSelect(){ctx.fillStyle='#101820';ctx.fillRect(0,0,GW,GH);text('Game Select / Test Menu',195,38,23,'#fff','center',true);const list=['world','darts','quiz','pour','arm','catch','tray','rhythm','memory','fart','surf','kevinfight','race','carbon','boss'];for(let i=0;i<list.length;i++){let x=73+(i%3)*122,y=104+Math.floor(i/3)*64;panel(x-52,y-22,104,44,.66);text(list[i],x,y+4,12,'#fff');}text('Tap a mode to test it. ESC returns during games.',195,610,12,'#ffe38a');}
function updateTitle(){drawTitle();}
function updateSelect(){drawSelect();if(consumeButton('ESC'))mode='title';}
function loop(ts){try{frame++;ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,GW,GH);if(mode==='title')updateTitle();else if(mode==='select')updateSelect();else if(mode==='world'){updateWorld();drawWorld();}else if(mode==='pub'){updatePub();drawPub();}else if(mode==='result'){updateResult();drawResult();}else if(mode==='race'){updateRace();drawRace();}else if(mode==='carbon'){updateCarbon();}else if(mode==='boss'){updateBoss();}else updateMinigame();drawMessage();if(mode!=='title'&&mode!=='select'&&mode!=='result')drawControls();}catch(e){console.error(e);ERR.style.display='block';ERR.textContent='Game error:\n'+(e&&e.stack?e.stack:e);return;}requestAnimationFrame(loop);}
window.__testStart=(m)=>{if(m==='world'){newGame();}else if(m==='boss')startBoss();else if(m==='race')startRace();else if(m==='carbon')startCarbon();else startMini(m,npcFor(m));};
window.__state=()=>({mode,score,district});
buildWorld();requestAnimationFrame(loop);
</script>
